<div class="login-container">
  <h2>Connexion</h2>

  <form (ngSubmit)="login()">

    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      placeholder="Email"
      required
    />

    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      placeholder="Mot de passe"
      required
    />

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Connexion...' : 'Se connecter' }}
    </button>

  </form>

  <!-- Petit lien s'inscrire -->
  <p class="register-link">
    Pas encore de compte ? 
    <a href="#" (click)="goToRegister(); $event.preventDefault()">S'inscrire</a>
  </p>
</div>
